[project]
name = "arknights-agent"
version = "0.1.0"
description = "明日方舟自我进化 AI Agent（Codex 决策 / MAA 操作 / MCP 通信）"
requires-python = ">=3.11"
dependencies = [
    # 锁 <2：本仓库的 stdio 客户端与离线替身按 mcp 1.x API 编写
    # （mcp.server.fastmcp.FastMCP、CallToolResult.isError）。mcp 2.x 已改名。
    "mcp>=1.2,<2",
    # 锁 <2.5：numpy 2.5 的 .pyi 用了 Python 3.12 才有的 `type` 语句，
    # 与本项目 requires-python >=3.11 + mypy python_version = 3.11 冲突。
    "numpy>=1.26,<2.5",
    "opencv-python>=4.9",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "typer>=0.12",
    # 感知层（阶段 2）：CPU 版 PyTorch 与 Ultralytics YOLOv8。
    # 本机实测 torch 2.14.0+cpu / torchvision 0.29.0+cpu / ultralytics 8.4.155；
    # CUDA 走可选依赖组，默认不装（PLANS.md：默认 CPU，GPU 结果不算放行依据）。
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",
]

[project.optional-dependencies]
# MaaMCP 提供 `maa-mcp` 可执行文件，是 Python 与 MAA 之间的 MCP server。
dev = [
    "maa-mcp>=1.2.3",
    "pytest>=8.0",
    # 阶段 1 门禁要求 mcp/ 与 device/ 覆盖率 ≥ 80%（scripts/verify.py）
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
arknights-agent = "arknights_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arknights_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "test_mcp_connection.py"]
exclude = ["\\.venv"]

[[tool.mypy.overrides]]
module = ["cv2", "maa.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要真机/模拟器与 MAA 环境的测试（默认不跑）",
]
